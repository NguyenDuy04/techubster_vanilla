<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Techubster</title>
        <link rel="stylesheet" href="/src/css/main.css">
        <link rel="stylesheet" href="/assets/icons/fontawesome/css/all.min.css">
    </head>
    <body>
        <div id="apps">
            <div id="topnav">
                <div class="topnav-list">
                    <div class="topnav-items">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <span>
                            Store Location
                        </span>
                    </div>
                    <div class="topnav-items">
                        <i class="fa-solid fa-download"></i>
                        <span>
                            Download App
                        </span>
                    </div>
                    <div class="topnav-items">
                        <span>Connects</span>
                        <div class="social_link">
                            <a href="https://facebook.com/" class="social_image">
                                <img src="/assets/icons/facebook-icon.svg" alt="">
                            </a>
                            <a href="https://instagram.com/" class="social_image">
                                <img src="/assets/icons/instagram-icon.svg" alt="">
                            </a>
                        </div>
                    </div>
                </div>
                <div class="topnav-list">
                    <div class="topnav-items topnav-item--language">VI</div>
                    <div class="topnav-items topnav-item--currency">VND</div>
                    <div class="topnav-items">
                        <i class="fa-regular fa-truck"></i>
                        <span>
                            Track Order
                        </span>    
                    </div>
                    <div class="topnav-items">
                        <i class="fa-regular fa-circle-question"></i>
                        <span>
                            Help
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
