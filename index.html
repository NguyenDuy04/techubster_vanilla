<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techubster</title>
    <link rel="icon" type="image/png" href="/assets/images/logo/techubster__logo-removebg-preview%20%282%29.png">
    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="stylesheet" href="/assets/icons/fontawesome/css/all.min.css">
    <script type="module" src="/src/js/layout/common.js"></script>
    <script type="module" src="/src/js/components/topnav.js"></script>
</head>

<body>
    <div id="apps">
        <site-topnav></site-topnav>
        <!-- <site-header></site-header> -->
        <header class="header">
            <div class="header__content">
                <a class="header__brand" href="/" aria-label="Techubster home">
                    <img src="/assets/images/logo/techubster__logo-removebg-preview%20%282%29.png" alt="">
                    <span>Techubster</span>
                </a>

                <details class="header__categories">
                    <summary>
                        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                        <span>Category</span>
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </summary>
                    <div class="header__category-menu">
                        <button type="button">New arrivals</button>
                        <button type="button">Clothing</button>
                        <button type="button">Accessories</button>
                    </div>
                </details>

                <div class="header__search" role="search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" name="search" aria-label="Search products" placeholder="Search products...">
                    <button type="button" aria-label="Search">
                        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="header__actions">
                    <button class="header__utility header__notification" type="button" aria-label="Notifications">
                        <i class="fa-regular fa-bell" aria-hidden="true"></i>
                    </button>
                    <button class="header__utility header__wishlist" type="button" aria-label="Wishlist">
                        <i class="fa-regular fa-heart" aria-hidden="true"></i>
                    </button>
                    <button class="header__utility header__cart" type="button" aria-label="Cart">
                        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                    </button>
                    <button class="header__avatar" type="button" aria-label="Your profile">
                        <img src="/assets/images/logo/avatars.jpg" alt="">
                    </button>
                </div>
            </div>
        </header>
    </div>
</body>

</html>
